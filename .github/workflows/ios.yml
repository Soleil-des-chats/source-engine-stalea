name: Build iOS

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Apple iOS toolchain
        run: |
          xcodebuild -version
          echo "iPhoneOS SDK:"
          xcrun --sdk iphoneos --show-sdk-path
          echo "Clang:"
          xcrun --sdk iphoneos -f clang
          echo "Clang++:"
          xcrun --sdk iphoneos -f clang++

      - name: Install dependencies
        run: |
          brew install sdl2 freetype

      - name: Configure iOS
        env:
          SDKROOT: iphoneos
          IPHONEOS_DEPLOYMENT_TARGET: "12.0"
          CC: clang
          CXX: clang++
        run: |
          export SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          export CC="$(xcrun --sdk iphoneos -f clang)"
          export CXX="$(xcrun --sdk iphoneos -f clang++)"

          echo "SDKROOT=$SDKROOT"
          echo "CC=$CC"
          echo "CXX=$CXX"

          ./waf configure \
            -T release \
            --ios \
            --disable-warns

      - name: Build iOS
        env:
          SDKROOT: iphoneos
          IPHONEOS_DEPLOYMENT_TARGET: "12.0"
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO
        run: |
          export SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          export CC="$(xcrun --sdk iphoneos -f clang)"
          export CXX="$(xcrun --sdk iphoneos -f clang++)"

          ./waf build

      - name: Find iOS application
        run: |
          echo "Searching for .app..."
          find . -type d -name "*.app" -print

      - name: Package unsigned IPA
        run: |
          set -e

          APP=$(find . -type d -name "*.app" | head -n 1)

          if [ -z "$APP" ]; then
            echo "ERROR: No .app was produced."
            exit 1
          fi

          echo "Found application:"
          echo "$APP"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP" Payload/

          APP_NAME=$(basename "$APP")
          
          codesign --remove-signature "Payload/$APP_NAME" 2>/dev/null || true

          zip -r Stalea-iOS-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Stalea-iOS-unsigned
          path: Stalea-iOS-unsigned.ipa
          if-no-files-found: error
