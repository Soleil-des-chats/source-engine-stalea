name: Build iOS

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      IPHONEOS_DEPLOYMENT_TARGET: "12.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$DEVELOPER_DIR"

          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos -f clang
          xcrun --sdk iphoneos -f clang++

      - name: Install build dependencies
        run: |
          brew install cmake sdl2

      # ------------------------------------------------------------
      # FreeType
      # ------------------------------------------------------------

      - name: Build FreeType for iOS
        run: |
          set -euxo pipefail

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

          rm -rf build/freetype-ios

          cmake \
            -S thirdparty/freetype \
            -B build/freetype-ios \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IPHONEOS_DEPLOYMENT_TARGET" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DFT_BUILD_TESTS=OFF

          cmake \
            --build build/freetype-ios \
            --parallel "$(sysctl -n hw.ncpu)"

          test -f build/freetype-ios/libfreetype.a

      # ------------------------------------------------------------
      # libjpeg
      # ------------------------------------------------------------

      - name: Build libjpeg for iOS
        run: |
          set -euxo pipefail

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

          rm -rf build/jpeg-ios

          cmake \
            -S thirdparty/libjpeg \
            -B build/jpeg-ios \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IPHONEOS_DEPLOYMENT_TARGET" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_STATIC=ON \
            -DBUILD_EXECUTABLES=OFF \
            -DBUILD_TESTS=OFF

          cmake \
            --build build/jpeg-ios \
            --target jpeg \
            --parallel "$(sysctl -n hw.ncpu)"

          JPEG_LIB="$(find build/jpeg-ios -name 'libjpeg*.a' | head -n 1)"

          if [ -z "$JPEG_LIB" ]; then
            echo "ERROR: no libjpeg*.a was produced."
            exit 1
          fi

          if [ ! -f "build/jpeg-ios/libjpeg.a" ]; then
            cp "$JPEG_LIB" build/jpeg-ios/libjpeg.a
          fi

          test -f build/jpeg-ios/libjpeg.a

      # ------------------------------------------------------------
      # libpng (links against the system zlib shipped in the iOS SDK)
      # ------------------------------------------------------------

      - name: Build libpng for iOS
        run: |
          set -euxo pipefail

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

          rm -rf build/png-ios

          cmake \
            -S thirdparty/libpng \
            -B build/png-ios \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IPHONEOS_DEPLOYMENT_TARGET" \
            -DCMAKE_BUILD_TYPE=Release \
            -DPNG_SHARED=OFF \
            -DPNG_STATIC=ON \
            -DPNG_EXECUTABLES=OFF \
            -DPNG_TESTS=OFF \
            -DZLIB_INCLUDE_DIR="$SDK/usr/include" \
            -DZLIB_LIBRARY="$SDK/usr/lib/libz.tbd" \
            -DCMAKE_C_FLAGS="-include math.h"

          cmake \
            --build build/png-ios \
            --parallel "$(sysctl -n hw.ncpu)"

          PNG_LIB="$(find build/png-ios -name 'libpng*.a' | head -n 1)"

          if [ -z "$PNG_LIB" ]; then
            echo "ERROR: no libpng*.a was produced."
            exit 1
          fi

          if [ ! -f "build/png-ios/libpng.a" ]; then
            cp "$PNG_LIB" build/png-ios/libpng.a
          fi

          test -f build/png-ios/libpng.a

      # ------------------------------------------------------------
      # curl (Secure Transport for TLS, no external SSL/SSH/IDN deps)
      # ------------------------------------------------------------

      - name: Build curl for iOS
        run: |
          set -euxo pipefail

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

          rm -rf build/curl-ios

          cmake \
            -S thirdparty/curl \
            -B build/curl-ios \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IPHONEOS_DEPLOYMENT_TARGET" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_CURL_EXE=OFF \
            -DCMAKE_USE_SECTRANSP=ON \
            -DCMAKE_USE_OPENSSL=OFF \
            -DUSE_LIBIDN2=OFF \
            -DCMAKE_USE_LIBSSH2=OFF \
            -DCURL_DISABLE_LDAP=ON \
            -DCURL_DISABLE_LDAPS=ON \
            -DHAVE_POLL_FINE_EXITCODE=0 \
            -DZLIB_INCLUDE_DIR="$SDK/usr/include" \
            -DZLIB_LIBRARY="$SDK/usr/lib/libz.tbd"

          cmake \
            --build build/curl-ios \
            --parallel "$(sysctl -n hw.ncpu)"

          CURL_LIB="$(find build/curl-ios -name 'libcurl*.a' | head -n 1)"

          if [ -z "$CURL_LIB" ]; then
            echo "ERROR: no libcurl*.a was produced."
            exit 1
          fi

          if [ ! -f "build/curl-ios/libcurl.a" ]; then
            cp "$CURL_LIB" build/curl-ios/libcurl.a
          fi

          test -f build/curl-ios/libcurl.a

      # ------------------------------------------------------------
      # SDL2 (built from thirdparty/SDL-src; thirdparty/SDL is headers-only
      # and has no library to link against)
      # ------------------------------------------------------------

      - name: Build SDL2 for iOS
        run: |
          set -euxo pipefail

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

          rm -rf build/sdl2-ios build/sdl2-ios-install

          cmake \
            -S thirdparty/SDL-src \
            -B build/sdl2-ios \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IPHONEOS_DEPLOYMENT_TARGET" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$(pwd)/build/sdl2-ios-install" \
            -DSDL_STATIC=ON \
            -DSDL_SHARED=OFF \
            -DSDL_TEST=OFF

          cmake \
            --build build/sdl2-ios \
            --parallel "$(sysctl -n hw.ncpu)"

          cmake --install build/sdl2-ios

          SDL2_LIB="$(find build/sdl2-ios-install -name 'libSDL2.a' | head -n 1)"

          if [ -z "$SDL2_LIB" ]; then
            echo "ERROR: no libSDL2.a was produced/installed."
            exit 1
          fi

          if [ ! -d "build/sdl2-ios-install/include/SDL2" ]; then
            echo "ERROR: SDL2 headers were not installed where expected."
            exit 1
          fi

          test -f "$SDL2_LIB"

      # ------------------------------------------------------------
      # Waf
      # ------------------------------------------------------------

      - name: Configure iOS
        run: |
          set -euxo pipefail

          export SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          export CC="$(xcrun --sdk iphoneos -f clang)"
          export CXX="$(xcrun --sdk iphoneos -f clang++)"

          ./waf configure \
            -T release \
            --ios \
            --togles \
            --disable-warns

      - name: Build iOS
        run: |
          set -euxo pipefail

          export SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          export CC="$(xcrun --sdk iphoneos -f clang)"
          export CXX="$(xcrun --sdk iphoneos -f clang++)"

          ./waf build

      # ------------------------------------------------------------
      # IPA
      # ------------------------------------------------------------

      - name: Find iOS app
        run: |
          set -e

          find . \
            -type d \
            -name "*.app" \
            -print

      - name: Package unsigned IPA
        run: |
          set -euxo pipefail

          APP="$(find . -type d -name "*.app" | head -n 1)"

          if [ -z "$APP" ]; then
            echo "ERROR: No .app was produced."
            exit 1
          fi

          echo "Using app: $APP"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP" Payload/

          APP_NAME="$(basename "$APP")"

          codesign --remove-signature "Payload/$APP_NAME" || true

          zip -r "Stalea-iOS-unsigned.ipa" Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Stalea-iOS-unsigned
          path: Stalea-iOS-unsigned.ipa
          if-no-files-found: error
